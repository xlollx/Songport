# Draft build recipe for F-Droid. It goes to https://gitlab.com/fdroid/fdroiddata as
# metadata/com.xlollx.songport.yml, through a merge request (see fdroid/README.md).
# Descriptions, icon, graphics and changelogs are read from fastlane/metadata/android in this repo;
# donation links from .github/FUNDING.yml.

AntiFeatures:
  NonFreeNet:
    en-US: Syncs playlists between proprietary music services (Spotify, Apple Music, YouTube Music, TIDAL, Deezer).

Categories:
  - Multimedia
License: GPL-3.0-only
AuthorName: xlollx
WebSite: https://xlollx.github.io/Songport/
SourceCode: https://github.com/xlollx/Songport
IssueTracker: https://github.com/xlollx/Songport/issues
Changelog: https://github.com/xlollx/Songport/releases

AutoName: Songport

RepoType: git
Repo: https://github.com/xlollx/Songport.git

Builds:
  - versionName: 1.0.43
    versionCode: 44
    commit: v1.0.43
    subdir: android/app
    gradle:
      - full
    # The play flavor (not built here) is the only one with the ads SDK: drop its lines so the
    # scanner does not flag them.
    prebuild: sed -i -e '/playImplementation/d' build.gradle

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.43
CurrentVersionCode: 44
