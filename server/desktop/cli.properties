# The command line's launcher in Trackhop Desktop (package.sh, jpackage --add-launcher): Cli.kt,
# with a console on Windows. `trackhop-cli`, since on Windows "trackhop.exe" is the app itself.
main-class=com.xlollx.songport.server.CliKt
win-console=true
java-options=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xmx128m
