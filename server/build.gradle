// Trackhop without a phone: the engine of :core behind a small web page and a scheduler, for a
// server or a NAS (see docs/guide/docker.md). Same Kotlin as the app (android/build.gradle).
plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.21'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.21' apply false
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

application {
    mainClass = 'com.xlollx.songport.server.MainKt'
    applicationName = 'songport-server'
}

// Trackhop Desktop's own window (Desktop.kt): SWT's Browser, on the system's web engine (Edge's
// WebView2 on Windows, WebKitGTK on Linux). Compiled against the Linux jar (the API is the same);
// package.sh puts the jar of the system being packed next to the others. Not in the Docker image.
def swtVersion = '3.135.0'
configurations {
    swtWindows { transitive = false }
    swtLinux { transitive = false }
}

dependencies {
    implementation project(':core')
    implementation project(':ytm')
    compileOnly("org.eclipse.platform:org.eclipse.swt.gtk.linux.x86_64:$swtVersion") { transitive = false }
    swtWindows("org.eclipse.platform:org.eclipse.swt.win32.win32.x86_64:$swtVersion") { transitive = false }
    swtLinux("org.eclipse.platform:org.eclipse.swt.gtk.linux.x86_64:$swtVersion") { transitive = false }
    testImplementation 'junit:junit:4.13.2'
}

// The Spotify and Deezer web clients of the app's :bridge module (the web players' own backends, no
// developer key), compiled here from where they live: the module needs the Android SDK, and the
// Trackhop Bridge repository copies it whole, so the files stay there. Only the files listed, which
// import nothing from Android (the module's other files are left out); the rest comes from :ytm.
def bridgeDir = file('../android/bridge/src/main/java')
def bridgeClients = ['BridgeNet.kt', 'WebHost.kt', 'SpotifyWebClient.kt', 'DeezerWebClient.kt']
sourceSets.main.kotlin {
    srcDir(bridgeDir)
    exclude { e -> !e.directory && e.file.toPath().startsWith(bridgeDir.toPath()) && !(e.name in bridgeClients) }
}

// `trackhop`, the command line (Cli.kt), next to the server's own script in installDist's bin/:
// the Docker image puts that folder on the PATH. A short-lived JVM: quick to start, small heap.
def cliScripts = tasks.register('cliStartScripts', CreateStartScripts) {
    mainClass = 'com.xlollx.songport.server.CliKt'
    applicationName = 'trackhop'
    outputDir = layout.buildDirectory.dir('cli-scripts').get().asFile
    classpath = tasks.named('startScripts').get().classpath
    defaultJvmOpts = ['-XX:TieredStopAtLevel=1', '-XX:+UseSerialGC', '-Xmx128m']
}
distributions.main.contents {
    into('bin') { from(cliScripts) }
}

tasks.register('desktopLibs', Copy) {
    into(layout.buildDirectory.dir('desktop-libs'))
    from(configurations.swtWindows) { into 'windows' }
    from(configurations.swtLinux) { into 'linux' }
}

// The app's texts, in every language it has: the engine names them, the server reads them as the
// app does (res/values*/strings.xml), so nothing is translated twice.
def appStrings = tasks.register('appStrings', Copy) {
    from(file('../android/app/src/main/res')) {
        include 'values*/strings.xml'
        exclude 'values-night/**'
    }
    into(layout.buildDirectory.dir('generated/appStrings/res'))
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/appStrings'))
tasks.named('processResources') { dependsOn appStrings }

// Two versions: the server's own (server/VERSION: Docker and Desktop, released on their own as
// server-v<version>), shown in the page footer and used as the image tag; and the app's, whose engine
// (:core) it runs, shown next to it.
def serverVersion = file('VERSION').text.trim()
def appVersion = {
    def m = file('../android/app/build.gradle').text =~ /versionName\s+"([^"]+)"/
    m.find() ? m.group(1) : 'dev'
}()
version = serverVersion
def versionFile = tasks.register('versionFile') {
    def dir = layout.buildDirectory.dir('generated/version')
    inputs.property('version', serverVersion)
    inputs.property('engine', appVersion)
    outputs.dir(dir)
    doLast {
        dir.get().file('songport-version.txt').asFile.text = serverVersion
        dir.get().file('engine-version.txt').asFile.text = appVersion
    }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/version'))
tasks.named('processResources') { dependsOn versionFile }

tasks.register('printVersion') { doLast { println serverVersion } }

test {
    // File names with accents (a playlist "Città"): the JVM reads them in the locale's encoding.
    if (!System.getProperty('os.name').startsWith('Windows')) environment 'LC_ALL', 'C.UTF-8'
    testLogging {
        events "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces false
    }
}
