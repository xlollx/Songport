// The web connectors of Trackhop Bridge (YouTube Music, Amazon Music, Spotify and Apple Music web
// sign-in), built into the GitHub and F-Droid build of Trackhop as a library. The Play build does not
// include it and keeps talking to the separate Bridge app.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.xlollx.songport.ytmbridge'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all { test ->
            test.testLogging {
                events "failed"
                exceptionFormat "full"
                showExceptions true
                showCauses true
                showStackTraces false
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Document-start scripts for the web players' WebViews.
    implementation 'androidx.webkit:webkit:1.13.0'
    // The YouTube Music client and the shared JSON helpers, free of Android (also used by the server).
    api project(':ytm')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'

    // Contract tests of the web clients: Robolectric stands in for the Android parts (preferences,
    // context) and every request goes to a local mock server, never to the services. Test-only.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
