plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Parametri di build: -PNOME=valore, oppure variabile d'ambiente NOME, altrimenti default.
// In CI arrivano da GitHub "Variables"/"Secrets" (vedi .github/workflows/build.yml).
def cfg = { String name, String dflt ->
    if (project.hasProperty(name) && project.property(name)) return project.property(name).toString()
    def env = System.getenv(name)
    return (env != null && !env.isEmpty()) ? env : dflt
}

def spotifyClientId = cfg('SPOTIFY_CLIENT_ID', '')
def tidalClientId   = cfg('TIDAL_CLIENT_ID', '')
def deezerAppId     = cfg('DEEZER_APP_ID', '')
// Deezer accetta solo redirect https: una paginetta statica che rimanda a songport://callback
// (vedi docs/deezer-redirect.html, pubblicabile su GitHub Pages).
def deezerRedirect  = cfg('DEEZER_REDIRECT_URL', 'https://xlollx.github.io/Songport/deezer-redirect.html')
def googleClientId  = cfg('GOOGLE_CLIENT_ID', '')
// Apple Music: JWT ES256 firmato con la chiave MusicKit (Apple Developer Program).
// Dura al massimo 6 mesi: va rigenerato e rimesso qui, oppure lo incolla l'utente nelle impostazioni.
def appleDeveloperToken = cfg('APPLE_DEVELOPER_TOKEN', '')
// Last.fm: API key gratuita e immediata (https://www.last.fm/api/account/create), solo lettura.
def lastfmApiKey = cfg('LASTFM_API_KEY', '')
// Google richiede come redirect lo schema "client id invertito".
def googleScheme = googleClientId
        ? 'com.googleusercontent.apps.' + googleClientId.replace('.apps.googleusercontent.com', '')
        : 'com.googleusercontent.apps.unconfigured'

// AdMob. Gli ID veri di Songport sono il default della build di release (non sono segreti: stanno in
// ogni APK); le build di debug usano sempre gli ID DI TEST di Google, cosi' chi sviluppa non genera
// traffico non valido. Un fork deve mettere i propri (variabili ADMOB_APP_ID / ADMOB_BANNER_ID).
def admobTestAppId    = 'ca-app-pub-3940256099942544~3347511713'
def admobTestBannerId = 'ca-app-pub-3940256099942544/9214589741'
def admobAppId    = cfg('ADMOB_APP_ID', 'ca-app-pub-8339336051440231~4237888161')
def admobBannerId = cfg('ADMOB_BANNER_ID', 'ca-app-pub-8339336051440231/9729887992')
// Dispositivi di test AdMob (id hash separati da virgola): ricevono annunci di prova anche con gli ID
// veri, cosi' chi sviluppa non genera traffico non valido sul proprio telefono.
def admobTestDevices = cfg('ADMOB_TEST_DEVICES', '')
def kofiUrl       = cfg('KOFI_URL', 'https://ko-fi.com/xlollx')
def privacyUrl    = cfg('PRIVACY_POLICY_URL', 'https://xlollx.github.io/Songport/privacy-policy')

def hasReleaseKey = System.getenv('KEYSTORE_FILE') != null && !System.getenv('KEYSTORE_FILE').isEmpty()

android {
    namespace 'com.xlollx.songport'
    compileSdk 36

    defaultConfig {
        applicationId "com.xlollx.songport"
        minSdk 26
        targetSdk 36
        versionCode 41
        versionName "1.0.40"

        buildConfigField "String", "SPOTIFY_CLIENT_ID", "\"${spotifyClientId}\""
        buildConfigField "String", "TIDAL_CLIENT_ID", "\"${tidalClientId}\""
        buildConfigField "String", "DEEZER_APP_ID", "\"${deezerAppId}\""
        buildConfigField "String", "DEEZER_REDIRECT_URL", "\"${deezerRedirect}\""
        buildConfigField "String", "GOOGLE_CLIENT_ID", "\"${googleClientId}\""
        buildConfigField "String", "APPLE_DEVELOPER_TOKEN", "\"${appleDeveloperToken}\""
        buildConfigField "String", "LASTFM_API_KEY", "\"${lastfmApiKey}\""
        buildConfigField "String", "GOOGLE_REDIRECT_SCHEME", "\"${googleScheme}\""
        buildConfigField "String", "ADMOB_BANNER_ID", "\"${admobBannerId}\""
        buildConfigField "String", "ADMOB_TEST_DEVICES", "\"${admobTestDevices}\""
        buildConfigField "String", "PRIVACY_POLICY_URL", "\"${privacyUrl}\""
        buildConfigField "String", "KOFI_URL", "\"${kofiUrl}\""

        manifestPlaceholders = [googleRedirectScheme: googleScheme, admobAppId: admobAppId]
    }

    // Two distributions of the same app. "play" is what goes to Google Play: it never links to, names
    // or describes any companion app; plugin-based services appear only if the user already has a
    // plugin installed. "full" (GitHub Releases) may point to where to get one.
    flavorDimensions = ["dist"]
    productFlavors {
        play {
            dimension "dist"
            buildConfigField "boolean", "PLUGIN_LINKS", "false"
        }
        full {
            dimension "dist"
            isDefault = true
            buildConfigField "boolean", "PLUGIN_LINKS", "true"
        }
    }

    signingConfigs {
        // Chiave di debug: se app/debug.keystore esiste (in CI arriva dal secret DEBUG_KEYSTORE_BASE64)
        // la firma resta stabile tra le build e gli aggiornamenti si installano sopra. Altrimenti
        // vale la chiave di debug standard di Android Studio.
        debug {
            def fixedDebugKey = file("debug.keystore")
            if (fixedDebugKey.exists()) {
                storeFile fixedDebugKey
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        // Chiave di upload per il Play Store: MAI nel repo, arriva dai secrets della CI.
        release {
            if (hasReleaseKey) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Annunci di prova, sempre: i veri ID restano alla release.
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${admobTestBannerId}\""
            manifestPlaceholders = [admobAppId: admobTestAppId]
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.activity:activity-compose:1.10.1'

    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Lavori in background (sync programmata)
    implementation 'androidx.work:work-runtime-ktx:2.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Login OAuth nel browser (Custom Tabs) e token cifrati
    implementation 'androidx.browser:browser:1.8.0'
    // WebView per MusicKit JS (login Apple Music): serve l'asset loader per avere un'origine https
    implementation 'androidx.webkit:webkit:1.12.1'
    // Sblocco con impronta/PIN all'apertura (opzionale)
    implementation 'androidx.biometric:biometric:1.1.0'
    // biometric 1.1.0 trascina Fragment 1.2: il lint di release ne richiede almeno 1.3 per registerForActivityResult.
    implementation 'androidx.fragment:fragment-ktx:1.8.8'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // HTTP + JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'

    // Pubblicità (banner AdMob) + consenso GDPR (UMP)
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'

    testImplementation 'junit:junit:4.13.2'
}
