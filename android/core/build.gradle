// Songport's engine, free of Android: the data model, track matching, playlist file formats,
// reordering and the other pure logic. The Android app depends on it, and so will the server
// (Docker) build. Nothing here may import android.* or androidx.*.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}

test {
    testLogging {
        events "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces false
    }
}
