# VirusTotal checks of a release's files: every file looked up (or uploaded) and checked by the
# antivirus engines VirusTotal runs; the results go into the release notes (a section of their own,
# replaced on a new check) and, for the README's badge and the site's security page, into the
# "badges" branch (virustotal-<app|desktop>.json, a shields.io endpoint, and virustotal/<app|desktop>.json).
# Called by build.yml and desktop.yml after a new release (a release made with the workflow's own
# token starts no other workflow), or by hand for any tag. Skipped until the VT_API_KEY secret exists.
name: VirusTotal

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.5.2 or server-v0.6.1'
        type: string
        required: true

permissions:
  contents: write

# One at a time: the free API allows 4 requests a minute, and both write the badges branch.
concurrency:
  group: virustotal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: No VT_API_KEY
        if: ${{ env.VT_API_KEY == '' }}
        run: echo "::notice::No VT_API_KEY secret, so the release's files are not checked."

      - name: Checkout
        if: ${{ env.VT_API_KEY != '' }}
        uses: actions/checkout@v7

      - name: The release's files
        if: ${{ env.VT_API_KEY != '' }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D files

      - name: Check them
        id: scan
        if: ${{ env.VT_API_KEY != '' }}
        run: python3 scripts/virustotal.py scan --tag "$TAG" --out out files/*

      - name: Into the release notes
        if: ${{ env.VT_API_KEY != '' }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > body.md
          python3 scripts/virustotal.py notes body.md out/notes.md > notes.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md

      - name: Into the badges branch
        if: ${{ env.VT_API_KEY != '' }}
        env:
          PRODUCT: ${{ steps.scan.outputs.product }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges; then
            git worktree add badges FETCH_HEAD
            git -C badges checkout -B badges
          else
            git worktree add --detach badges
            git -C badges checkout --orphan badges
            git -C badges rm -rf --quiet .
            printf 'Data for the badges of the README and the site, written by .github/workflows/virustotal.yml.\n' > badges/README.md
          fi
          mkdir -p badges/virustotal
          # Only a newer version replaces the one shown (a check of an older tag by hand leaves it).
          shown=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "badges/virustotal/$PRODUCT.json" 2>/dev/null || echo 0)
          new=$(python3 -c "import json; print(json.load(open('out/report.json'))['version'])")
          if [ "$(printf '%s\n%s\n' "$shown" "$new" | sort -V | tail -1)" != "$new" ]; then
            echo "The badge shows $shown, newer than $new: left as it is."; exit 0
          fi
          cp out/report.json "badges/virustotal/$PRODUCT.json"
          cp out/badge.json "badges/virustotal-$PRODUCT.json"
          git -C badges add -A
          git -C badges diff --cached --quiet && { echo "No change."; exit 0; }
          git -C badges commit -q -m "VirusTotal: $TAG"
          git -C badges push origin badges

      - name: Flagged
        if: ${{ steps.scan.outputs.flagged == 'true' }}
        run: |
          echo "::error::An engine flags a file of $TAG: see the release notes' VirusTotal section."
          exit 1
