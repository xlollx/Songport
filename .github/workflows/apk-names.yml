# One-off, by hand: the app's releases from a version on also get their APK as "Trackhop-v<version>.apk"
# (a copy of "Songport-v<version>.apk", which stays), so F-Droid finds the new name for the versions it
# has still to build once its metadata's Binaries line names Trackhop-v%v.apk.
name: APK names

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'First version to copy, e.g. 1.3.8'
        type: string
        required: true
        default: '1.3.8'

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FROM: ${{ inputs.from }}
    steps:
      - name: Copy the APKs under the new name
        run: |
          set -e
          gh release list -R "$GITHUB_REPOSITORY" --limit 500 --json tagName -q '.[].tagName' | grep -E '^v[0-9.]+$' | while read -r tag; do
            v="${tag#v}"
            [ "$(printf '%s\n%s\n' "$FROM" "$v" | sort -V | head -1)" = "$FROM" ] || continue
            assets=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            if echo "$assets" | grep -qx "Trackhop-$tag.apk"; then echo "$tag: has it already"; continue; fi
            if ! echo "$assets" | grep -qx "Songport-$tag.apk"; then echo "$tag: no Songport-$tag.apk"; continue; fi
            rm -rf dl && mkdir dl
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "Songport-$tag.apk" -D dl
            mv "dl/Songport-$tag.apk" "dl/Trackhop-$tag.apk"
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" "dl/Trackhop-$tag.apk"
            echo "$tag: Trackhop-$tag.apk added"
          done
