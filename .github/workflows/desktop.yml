name: Desktop

# Trackhop Desktop (beta, docs/guide/desktop.md): the server's engine and pages packed as an app
# with its own Java runtime, by server/desktop/package.sh. Windows: an MSI (per-user, no
# administrator) and a portable ZIP; Linux: a .deb and a tar.gz for any distribution. Every run keeps
# them as artifacts; on main, a new server/VERSION gets its own release, server-v<version>, with
# them (the Docker image of the same version comes from server.yml).
on:
  push:
    paths:
      - 'server/**'
      - 'android/core/**'
      - 'android/ytm/**'
      - 'android/bridge/src/main/java/**'
      - 'android/app/src/main/res/**'
      - 'android/app/build.gradle'
      - 'packaging/msix/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'android/core/**'
      - 'android/ytm/**'
      - 'android/bridge/src/main/java/**'
      - 'android/app/src/main/res/**'
      - 'android/app/build.gradle'
      - 'packaging/msix/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # macOS twice: Apple silicon (macos-latest) and Intel, one .dmg each.
        os: [ ubuntu-latest, windows-latest, macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21 (jpackage)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: WiX 3 (MSI)
        if: runner.os == 'Windows'
        run: |
          choco install wixtoolset --no-progress -y
          echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" >> "$GITHUB_PATH"

      - name: fakeroot (deb)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q fakeroot

      - name: Tests and build
        run: gradle -p server test installDist desktopLibs --no-daemon --stacktrace

      - name: Package
        run: server/desktop/package.sh

      - name: MSIX (Microsoft Store)
        # Unsigned: the Store signs it. The identity is Partner Center's (Product identity), kept as
        # repository variables; the defaults only make a package to try out.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'xlollx.TrackhopDesktop' }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=6C91EA3D-59AB-47BA-8ACB-5DF74CE63DDF' }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'xlollx' }}
        run: >-
          ./packaging/msix/build.ps1 -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER
          -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME

      - name: Starts and answers
        # The packed app on its own runtime: it serves its pages on 127.0.0.1, its command line finds
        # it with nothing set up, and it stops from the page.
        env:
          APPDATA: ${{ runner.temp }}/appdata
          XDG_DATA_HOME: ${{ runner.temp }}/appdata
        run: |
          out=server/build/desktop/out
          case "$RUNNER_OS" in
            Windows) app=$out/Trackhop/Trackhop.exe; cli=$out/Trackhop/trackhop-cli.exe ;;
            macOS) app=$out/Trackhop.app/Contents/MacOS/Trackhop; cli=$out/Trackhop.app/Contents/MacOS/trackhop-cli ;;
            *) app=$out/Trackhop/bin/Trackhop; cli=$out/Trackhop/bin/trackhop-cli ;;
          esac
          "$app" --background &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8642/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8642/ | grep -q "Trackhop Desktop"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8642/)" = 403
          "$cli" status | tee cli.txt
          grep -q "0 syncs" cli.txt
          curl -sf -X POST -H "Origin: http://127.0.0.1:8642" http://127.0.0.1:8642/quit > /dev/null
          sleep 3
          ! curl -sf -m 3 http://127.0.0.1:8642/health

      - name: Keep as artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Trackhop-Desktop-${{ runner.os }}${{ runner.os == 'macOS' && format('-{0}', runner.arch) || '' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  flatpak:
    # On main, the Flatpak bundle for the release (flatpak.yml: built from source, as Flathub would).
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/flatpak.yml

  release:
    # On main, a server version without its release yet: the release "server-v<version>" with the
    # files of both systems, the Flatpak and the notes of server/CHANGELOG.md. A prerelease, never
    # "latest": the app's releases (v<version>) stay the ones Obtainium and the site's links pick.
    # A failed Flatpak does not hold the release back: it goes out without the bundle.
    needs: [ package, flatpak ]
    if: ${{ !cancelled() && needs.package.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      # Set only when this run made the release, for the stores job.
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Files of both systems
        uses: actions/download-artifact@v7
        with:
          pattern: Trackhop-Desktop-*
          path: dist
          merge-multiple: true

      - name: Flatpak
        if: ${{ needs.flatpak.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: Trackhop-Flatpak
          path: flatpak

      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d '[:space:]' < server/VERSION)
          tag="server-v$v"
          if gh release view "$tag" > /dev/null 2>&1; then echo "$tag is out already."; exit 0; fi
          if [ -f flatpak/Trackhop.flatpak ]; then mv flatpak/Trackhop.flatpak "dist/Trackhop-Desktop-v$v-linux.flatpak"; fi
          # This version's section of server/CHANGELOG.md, without its heading.
          awk -v v="$v" '/^## /{p = ($2 == v)} p && !/^## /' server/CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          **Docker:** \`docker pull ghcr.io/xlollx/trackhop:$v\` (or \`:latest\`). [Docker guide](https://xlollx.github.io/Trackhop/guide/docker) · [Desktop guide](https://xlollx.github.io/Trackhop/guide/desktop)

          The \`.msix\` is the package for the Microsoft Store, unsigned: it does not install by itself; use the \`.msi\` or the \`.zip\`.

          **macOS:** \`-macos-arm64.dmg\` for Apple silicon (M1 and later), \`-macos-x64.dmg\` for Intel Macs. Not signed by Apple: the first time, macOS refuses to open it; then *System Settings › Privacy & Security › Open Anyway* ([how](https://xlollx.github.io/Trackhop/guide/desktop#macos)).

          **Flatpak (Linux):** \`flatpak install --user Trackhop-Desktop-v$v-linux.flatpak\`, then *Trackhop* in the menu (needs Flathub's GNOME runtime, which Flatpak offers to install).
          EOF
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Trackhop Desktop & Server $v (beta)" --notes-file notes.md
          echo "version=$v" >> "$GITHUB_OUTPUT"

  stores:
    # The new release to winget and Chocolatey (stores.yml; each skipped until its secret exists).
    # Here rather than on the release event: a release made with the workflow's own token starts no
    # other workflow.
    needs: release
    if: ${{ needs.release.outputs.version != '' }}
    uses: ./.github/workflows/stores.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
