name: Server

# Trackhop server (server/, docs/guide/docker.md): tests, then the Docker image. On main the image
# is published to ghcr.io/xlollx/trackhop as "latest" and as the app's version, with the same tags also
# to ghcr.io/xlollx/songport (the name from before the rename) so existing installs keep updating; on
# any other branch it is only built, to prove the Dockerfile still works.
on:
  push:
    paths:
      - 'server/**'
      - 'android/core/**'
      - 'android/ytm/**'
      - 'android/app/src/main/res/**'
      - 'android/app/build.gradle'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'android/core/**'
      - 'android/ytm/**'
      - 'android/app/src/main/res/**'
      - 'android/app/build.gradle'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Tests
        run: gradle -p server test installDist --no-daemon --stacktrace

      - name: Version
        id: version
        run: echo "name=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/xlollx/trackhop:latest
            ghcr.io/xlollx/trackhop:${{ steps.version.outputs.name }}
            ghcr.io/xlollx/songport:latest
            ghcr.io/xlollx/songport:${{ steps.version.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
