name: Server

# Trackhop server (server/, docs/guide/docker.md): tests, then the Docker image. On main the image
# is published to ghcr.io/xlollx/trackhop as "latest" and as the server's version (server/VERSION, which
# Desktop shares; images up to 1.3.8 carried the app's version instead), with the same tags also
# to ghcr.io/xlollx/songport (the name from before the rename) so existing installs keep updating, and
# to Docker Hub (docker.io/xlollx/trackhop, with packaging/dockerhub/README.md as its page) once the
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets exist (packaging/README.md); on any other branch it
# is only built, to prove the Dockerfile still works.
on:
  push:
    paths:
      - 'server/**'
      - 'android/core/**'
      - 'android/ytm/**'
      - 'android/bridge/src/main/java/**'
      - 'android/app/src/main/res/**'
      - 'android/app/build.gradle'
      - '.dockerignore'
      - 'packaging/dockerhub/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'android/core/**'
      - 'android/ytm/**'
      - 'android/bridge/src/main/java/**'
      - 'android/app/src/main/res/**'
      - 'android/app/build.gradle'
      - '.dockerignore'
      - 'packaging/dockerhub/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Docker Hub only when both secrets are there (an access token with Read, Write, Delete: the
      # description step needs Delete's scope); without them it is skipped.
      DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'xlollx/trackhop' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Tests
        run: gradle -p server test installDist --no-daemon --stacktrace

      - name: Version
        id: version
        # The server's own version (server/VERSION), not the app's.
        run: echo "name=$(tr -d '[:space:]' < server/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true' && env.DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          images="ghcr.io/xlollx/trackhop ghcr.io/xlollx/songport"
          if [ "$DOCKERHUB" = true ]; then images="$images docker.io/$DOCKERHUB_REPOSITORY"; fi
          {
            echo 'list<<EOF'
            for image in $images; do echo "$image:latest"; echo "$image:$VERSION"; done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub page
        # The repository's description on hub.docker.com, from packaging/dockerhub/README.md.
        if: env.PUBLISH == 'true' && env.DOCKERHUB == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPOSITORY }}
          short-description: Beta. Keeps playlists in sync between music services, on your own server
          readme-filepath: packaging/dockerhub/README.md
