name: Build

# Compila Trackhop. Parte a ogni push su main, sulle pull request e a mano
# da GitHub -> Actions -> "Build" -> "Run workflow".
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# contents: write is needed to create the tag and the GitHub Release; nothing else is granted.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Set only when this run made the release, for the VirusTotal job.
      tag: ${{ steps.rel.outputs.tag }}
    defaults:
      run:
        working-directory: android
    env:
      # ID OAuth dei servizi (GitHub -> Settings -> Secrets and variables -> Actions -> Variables).
      # Se mancano l'app compila comunque: il servizio risulta "non configurato" finche' l'utente
      # non inserisce il proprio client ID nelle impostazioni avanzate.
      SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      TIDAL_CLIENT_ID: ${{ vars.TIDAL_CLIENT_ID }}
      DEEZER_APP_ID: ${{ vars.DEEZER_APP_ID }}
      DEEZER_REDIRECT_URL: ${{ vars.DEEZER_REDIRECT_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      # Apple Music: JWT con scadenza (max 6 mesi), quindi sta nei Secrets non nelle Variables.
      APPLE_DEVELOPER_TOKEN: ${{ secrets.APPLE_DEVELOPER_TOKEN }}
      LASTFM_API_KEY: ${{ vars.LASTFM_API_KEY }}
      # AdMob: se assenti si usano gli ID di TEST di Google (annunci di prova).
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
      ADMOB_TEST_DEVICES: ${{ vars.ADMOB_TEST_DEVICES }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
      KOFI_URL: ${{ vars.KOFI_URL }}
      # Keystore di debug (base64) per una firma stabile dell'APK debug; facoltativo.
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Il default dell'action installa anche il pacchetto obsoleto "tools", sparito dal
          # repository Google: senza questa riga lo step fallisce con "Failed to find package 'tools'".
          packages: platform-tools

      - name: Installa platform e build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Test unitari
        # :bridge:testDebugUnitTest: the web connectors' contract tests (Robolectric, local mock server only).
        run: gradle :core:test :ytm:test testFullDebugUnitTest :bridge:testDebugUnitTest --no-daemon --stacktrace

      - name: Chiave di debug fissa (se configurata)
        # Con il secret DEBUG_KEYSTORE_BASE64 la firma dell'APK debug resta uguale tra le build,
        # cosi' gli aggiornamenti si installano sopra. Senza, vale una chiave di debug generata al volo.
        if: ${{ env.DEBUG_KEYSTORE_BASE64 != '' }}
        run: echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore

      - name: Build APK debug (full flavor)
        run: gradle assembleFullDebug --no-daemon --stacktrace

      - name: Carica l'APK come artifact
        # Se la quota artifact dell'account e' piena l'upload fallisce, ma la build e' comunque valida.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Songport-debug-apk
          path: android/app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          # Gli APK pesano: senza scadenza breve si satura la quota artifact dell'account.
          retention-days: 7

      # ---- Release per il Play Store (solo se e' configurata la chiave di upload nei Secrets) ----
      - name: Verifica presenza chiave di release
        id: key
        run: |
          if [ -n "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Decodifica keystore di upload
        if: steps.key.outputs.present == 'true'
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build AAB e APK release firmati
        if: steps.key.outputs.present == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        # The AAB for Google Play is the "play" flavor (no plugin references), built with the
        # repository's variables. The APK for direct download is the "full" flavor, built with none of
        # them: F-Droid rebuilds it from source with the defaults in app/build.gradle and publishes it
        # only if it comes out identical (1.3.6 did not: a stale PRIVACY_POLICY_URL variable).
        run: |
          gradle bundlePlayRelease --no-daemon --stacktrace
          env -u SPOTIFY_CLIENT_ID -u TIDAL_CLIENT_ID -u DEEZER_APP_ID -u DEEZER_REDIRECT_URL \
              -u GOOGLE_CLIENT_ID -u APPLE_DEVELOPER_TOKEN -u LASTFM_API_KEY -u ADMOB_APP_ID \
              -u ADMOB_BANNER_ID -u ADMOB_TEST_DEVICES -u ADMOB_LIVE -u PRIVACY_POLICY_URL -u KOFI_URL -u SPONSORS_URL \
            gradle assembleFullRelease --no-daemon --stacktrace

      - name: Carica l'AAB come artifact
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Songport-release-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Carica l'APK release come artifact
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Songport-release-apk
          path: android/app/build/outputs/apk/full/release/app-full-release.apk
          if-no-files-found: error
          retention-days: 14

      # ---- GitHub Release: on a push to main whose versionName has no tag yet, create the tag and
      # publish the signed APK (direct download) and the AAB (for the Play Console). ----
      - name: Decide whether to publish a release
        id: rel
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.key.outputs.present == 'true' }}
        run: |
          v=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$v" ]; then echo "versionName not found"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "Tag v$v already exists: nothing to publish."
          else
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          fi

      - name: Name release assets after the version
        if: ${{ steps.rel.outputs.tag != '' }}
        # "Trackhop-v<version>.apk" and "-play.aab". Until F-Droid's metadata (fdroiddata) names
        # Trackhop-v%v.apk in its Binaries line, the APK also goes out under its old name,
        # "Songport-v<version>.apk", which that line still asks for: then KEEP_SONGPORT_APK goes.
        env:
          KEEP_SONGPORT_APK: 'true'
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          cp app/build/outputs/apk/full/release/app-full-release.apk "$GITHUB_WORKSPACE/Trackhop-$tag.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "$GITHUB_WORKSPACE/Trackhop-$tag-play.aab"
          if [ "$KEEP_SONGPORT_APK" = true ]; then cp "$GITHUB_WORKSPACE/Trackhop-$tag.apk" "$GITHUB_WORKSPACE/Songport-$tag.apk"; fi

      - name: GitHub Release
        if: ${{ steps.rel.outputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            Trackhop-*.apk
            Trackhop-*.aab
            Songport-*.apk
          generate_release_notes: true

  virustotal:
    # The new release's files checked by VirusTotal (virustotal.yml): the results go into its notes
    # and the README's badge. Skipped until the VT_API_KEY secret exists.
    needs: build
    if: ${{ needs.build.outputs.tag != '' }}
    uses: ./.github/workflows/virustotal.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
