name: Bug report
description: Something did not work as described. Italiano va benissimo.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the beta. The **technical details report** is what makes a report actionable:
        in Songport open **Settings** → **Sync log** → **Share technical details** and paste it below. It contains
        versions, connectors, the last sync steps and the plugin statistics; it never contains tokens,
        passwords or track lists.
  - type: input
    id: version
    attributes:
      label: Songport version (and Bridge version, if installed)
      placeholder: "Songport 1.0.35 (Play or GitHub APK?), Bridge 1.3.21"
    validations:
      required: true
  - type: dropdown
    id: services
    attributes:
      label: Services involved
      multiple: true
      options: [Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, Subsonic/Navidrome, Jellyfin, Plex, Last.fm, ListenBrainz, Files, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Technical details report
      description: Settings → Sync log → Share technical details → paste here.
      render: text
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 8, Android 15"
